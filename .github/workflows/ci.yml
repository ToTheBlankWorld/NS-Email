name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests, lint, types, evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check backend engine scripts

      - name: Ruff (format)
        run: python -m ruff format --check backend engine scripts

      - name: Mypy (strict)
        run: python -m mypy

      - name: Tests (engine + backend)
        run: python -m pytest engine/tests backend/tests -q

      - name: Deterministic evaluation suite
        run: python -m scripts.evaluate --repeat 2

      - name: Case evaluation suite
        run: python -m scripts.evaluate_cases --repeat 2

      - name: Correlation evaluation suite
        run: python -m scripts.evaluate_correlations --repeat 2

      - name: Remediation evaluation suite
        run: python -m scripts.evaluate_remediation --repeat 2

      - name: Drift evaluation suite
        run: python -m scripts.evaluate_drift --repeat 2

      - name: Demo workflow (offline, mock AI)
        run: python -m scripts.demo --run-once

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
