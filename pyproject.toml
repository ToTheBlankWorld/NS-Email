[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-email"
version = "0.5.0"
description = "SecureMailScope — AI-assisted cryptographic security posture assessment for secure email communications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NS-Email Team" }]
keywords = [
  "network-forensics",
  "pcap",
  "email-security",
  "tls",
  "starttls",
  "x509",
  "security-assessment",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "cryptography>=42",
  "fastapi>=0.115",
  "fpdf2>=2.8",
  "httpx>=0.27",
  "pydantic>=2.9",
  "python-multipart>=0.0.20",
  "scikit-learn>=1.4",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/ToTheBlankWorld/NS-Email"

# The backend package lives at backend/app but is imported as `app`.
[tool.setuptools]
packages = ["app", "app.routers", "engine", "engine.core"]

[tool.setuptools.package-dir]
app = "backend/app"
engine = "engine"

[tool.setuptools.package-data]
engine = ["py.typed", "detection/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "engine/tests"]
pythonpath = ["backend", "."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "engine"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "S",   # flake8-bandit (security)
  "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]
"engine/tests/**" = ["S101", "S105"]
# Evaluation/demo/smoke scripts are verification tools: assert IS the
# control flow, and urllib is used against the local demo server only.
"scripts/**" = ["S101", "S310", "RUF005"]
# S105: the credential constants in test_imap_pop3_sessions.py are synthetic
# fixtures whose absence from API/DB/log output is exactly what is asserted.
# The packet inspector launches tshark with fixed argument arrays (never a
# shell, never user-controlled strings), so subprocess use is reviewed here.
"engine/ingestion/inspector.py" = ["S404", "S603"]
# The store builds INSERT statements from hard-coded column lists; all
# values are parameterized (?) so SQL injection is not possible.
"backend/app/store.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
# Strict checking covers production code; test suites are lint-clean but
# excluded from strict type checking deliberately.
files = [
  "backend/app",
  "engine/__init__.py",
  "engine/analysis.py",
  "engine/core",
  "engine/ingestion",
  "engine/protocols",
  "engine/transport",
  "engine/detection",
  "engine/crypto",
  "engine/ml",
  "engine/graph",
  "engine/ai",
  "engine/correlation",
  "engine/verification",
  "engine/drift",
]
strict = true
pretty = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
